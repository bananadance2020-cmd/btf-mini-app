       Геометрия крыльев = wing-mark.svg (та же симметрия, те же точки сочленения):
         #wing-l → transform-origin 60% 50% ≈ (58, 48)
         #wing-r → transform-origin 40% 50% ≈ (38, 48)
       #check-path: pathLength="24" → stroke-dasharray: 24 (совместимость с Motion 03 §7).
       Glow НЕ встроен фильтрами — наводится CSS: filter: drop-shadow(0 0 6px rgba(53,230,255,.55))
       drop-shadow(0 0 18px rgba(53,230,255,.25)) на контейнере; слои .underglow ниже — статичная
       база свечения для сред без CSS-фильтров (фолбэк бюджетного Android). -->
